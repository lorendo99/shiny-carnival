kind = "mobile"
previewPath = "/fixmate-mobile/"
title = "FixMate Mobile"
description = "A native camera-first companion for diagnosing household repair problems, understanding safety risks, estimating costs, and deciding the next best action."
version = "1.0.0"
id = "artifacts/fixmate-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/fixmate-mobile/" ]
localPort = 20959

[services.development]
run = "pnpm --filter @workspace/fixmate-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fixmate-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fixmate-mobile", "run", "serve" ]

[services.env]
PORT = "20959"
BASE_PATH = "/fixmate-mobile/"
